[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/modules/catalog",
    "crates/modules/clients",
    "crates/modules/deliveries",
    "crates/modules/identity",
    "crates/modules/locations",
    "crates/modules/reports",
    "crates/modules/whitelists",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
argon2 = "0.5"
axum = "=0.8.9"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

skladno-core = { path = "crates/core" }
skladno-catalog = { path = "crates/modules/catalog" }
skladno-clients = { path = "crates/modules/clients" }
skladno-deliveries = { path = "crates/modules/deliveries" }
skladno-identity = { path = "crates/modules/identity" }
skladno-locations = { path = "crates/modules/locations" }
skladno-reports = { path = "crates/modules/reports" }
skladno-whitelists = { path = "crates/modules/whitelists" }
