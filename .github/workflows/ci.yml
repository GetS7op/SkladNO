# Проверки при каждом push и pull request: backend, frontend и приёмка SPEC на чистом стенде в Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (fmt, clippy, тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (ESLint, типы, тесты, сборка)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --check src
      - run: npm run lint
      - run: npm test
      - run: npm run build

  acceptance:
    name: Приёмка (Docker, scripts/acceptance.sh)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Настройки как на сервере
        run: SKLADNO_IP=127.0.0.1 scripts/configure.sh
      - name: Сборка и запуск
        run: docker compose up -d --build --wait
      - name: Критерии приёмки SPEC
        run: scripts/acceptance.sh http://127.0.0.1:8090
      - name: HTTPS через Caddy со своим центром сертификации
        run: |
          curl -sf http://127.0.0.1/ca.crt -o ca.crt
          curl -sf --cacert ca.crt https://127.0.0.1/api/v1/health
      - name: Журнал приложения при ошибке
        if: failure()
        run: docker compose logs --no-color app caddy
