name: skladno

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: skladno
      POSTGRES_USER: skladno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Запустите scripts/configure.sh}
    # Порт БД открыт только на localhost сервера — для разработки и pg_dump.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skladno -d skladno"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Приложение для сервера: `docker compose up -d --build`. При разработке запускайте только postgres.
  app:
    build: .
    image: skladno:latest
    environment:
      DATABASE_URL: postgres://skladno:${POSTGRES_PASSWORD}@postgres:5432/skladno
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
