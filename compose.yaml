name: skladno

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: skladno
      POSTGRES_USER: skladno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Запустите scripts/configure.sh}
    # Порт БД открыт только на localhost сервера — для разработки и pg_dump.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skladno -d skladno"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Приложение для сервера: `docker compose up -d --build`. При разработке запускайте только postgres.
  # Снаружи оно доступно через caddy по HTTPS; HTTP-порт открыт только на localhost сервера
  # (APP_BIND=0.0.0.0 — открыть HTTP в сеть без шифрования, если HTTPS не нужен).
  app:
    build: .
    image: skladno:latest
    environment:
      DATABASE_URL: postgres://skladno:${POSTGRES_PASSWORD}@postgres:5432/skladno
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS в локальной сети: свой центр сертификации, сертификат на SKLADNO_IP (deploy/Caddyfile).
  caddy:
    image: caddy:2.10-alpine
    environment:
      SKLADNO_IP: ${SKLADNO_IP:-127.0.0.1}
      SKLADNO_NAMES: ${SKLADNO_NAMES:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Ключи центра сертификации: при потере тома устройствам придётся ставить новый корневой сертификат.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
